<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; padding: 20px; background: #fff; color: #333; }
  h3 { margin-bottom: 12px; font-size: 16px; }
  .lender-list { max-height: 400px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 15px; }
  .lender-item { padding: 10px 12px; border-bottom: 1px solid #e8e8e8; transition: background 0.15s; }
  .lender-item:last-child { border-bottom: none; }
  .lender-header { display: flex; align-items: center; cursor: pointer; }
  .lender-header:hover { background: #f5f8ff; }
  .lender-item input[type="checkbox"] { margin-right: 10px; cursor: pointer; width: 16px; height: 16px; flex-shrink: 0; }
  .lender-item label { cursor: pointer; flex: 1; font-size: 14px; font-weight: 500; }
  .lender-item.disabled { opacity: 0.4; cursor: not-allowed; }
  .lender-item.disabled label { cursor: not-allowed; }
  .lender-notes { margin-top: 6px; margin-left: 26px; display: none; }
  .lender-notes textarea { width: 100%; height: 55px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; resize: vertical; font-family: inherit; font-size: 12px; }
  .lender-notes textarea:focus { outline: none; border-color: #1890ff; }
  .lender-notes-label { font-size: 11px; color: #888; margin-bottom: 3px; display: block; }
  .info { font-weight: 600; margin-bottom: 6px; display: block; font-size: 13px; }
  .count { color: #888; font-size: 12px; margin-bottom: 8px; display: block; }
  .btn { background: #1890ff; color: #fff; border: none; padding: 10px 28px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 12px; }
  .btn:hover { background: #40a9ff; }
  .btn:disabled { background: #ccc; cursor: not-allowed; }
  .error { color: #e74c3c; font-size: 12px; margin-top: 6px; display: block; min-height: 18px; }
  .success { color: #27ae60; font-size: 14px; text-align: center; padding: 40px 20px; }
  #loading { text-align: center; padding: 40px; color: #888; font-size: 14px; }
  #debug { background: #f8f8f8; border: 1px solid #ddd; padding: 10px; margin-top: 10px; font-size: 11px; font-family: monospace; white-space: pre-wrap; max-height: 150px; overflow-y: auto; display: none; }
</style>
</head>
<body>

<div id="loading">Loading lenders...</div>
<div id="debug"></div>

<div id="app" style="display:none;">
  <h3>Submit Application to Lenders</h3>
  <span class="info">Select Lenders (max 4):</span>
  <span id="selected-count" class="count">0 / 4 selected</span>
  <div id="lender-list" class="lender-list"></div>
  <span id="error" class="error"></span>
  <button id="submit-btn" class="btn" onclick="submitApplication()">Submit</button>
</div>

<div id="done" style="display:none;" class="success">
  Task created successfully!<br>Closing...
</div>

<script>
var dealId = null;
var dealName = "";
var MAX_LENDERS = 4;

function log(msg) {
  var d = document.getElementById("debug");
  d.textContent += new Date().toLocaleTimeString() + ": " + msg + "\n";
  d.scrollTop = d.scrollHeight;
}

ZOHO.embeddedApp.on("PageLoad", function(data) {
  log("PageLoad fired");
  log("Data: " + JSON.stringify(data).substring(0, 300));

  dealId = data.EntityId || data.entity_id || null;
  if (Array.isArray(dealId)) dealId = dealId[0];
  log("Deal ID: " + dealId);

  if (!dealId) {
    document.getElementById("loading").innerHTML = "Error: No Deal ID found";
    return;
  }

  ZOHO.CRM.API.getRecord({ Entity: "Deals", RecordID: dealId })
    .then(function(dealResult) {
      dealName = dealResult.data[0].Deal_Name;
      log("Deal name: " + dealName);
      return ZOHO.CRM.API.getAllRecords({
        Entity: "Lenders",
        sort_by: "Name",
        sort_order: "asc",
        per_page: 200
      });
    })
    .then(function(lenderResult) {
      var allLenders = (lenderResult && lenderResult.data) ? lenderResult.data : [];
      log("Total lenders: " + allLenders.length);

      var activeLenders = allLenders.filter(function(l) {
        return l.Active === true || l.Active === "true";
      });
      log("Active lenders: " + activeLenders.length);

      var lendersToShow = activeLenders.length > 0 ? activeLenders : allLenders;
      renderLenders(lendersToShow);
      document.getElementById("loading").style.display = "none";
      document.getElementById("app").style.display = "block";
    })
    .catch(function(err) {
      log("ERROR: " + JSON.stringify(err));
      if (err && err.message) log("ERROR message: " + err.message);
      document.getElementById("debug").style.display = "block";
      document.getElementById("loading").innerHTML = "Error - see debug log below";
    });
});

ZOHO.embeddedApp.init();
log("Widget initialized, waiting for PageLoad...");

function renderLenders(lenders) {
  var container = document.getElementById("lender-list");
  if (!lenders || lenders.length === 0) {
    container.innerHTML = '<div class="lender-item">No lenders found</div>';
    return;
  }

  var html = "";
  lenders.forEach(function(lender, i) {
    var name = lender.Lender_Name || lender.Name || "Unknown";
    html += '<div class="lender-item" id="item_' + i + '">' +
      '<div class="lender-header" onclick="toggleCheckbox(' + i + ')">' +
        '<input type="checkbox" id="cb_' + i + '" data-name="' + escapeHtml(name) + '" onclick="event.stopPropagation(); toggleCheckbox(' + i + ', true);">' +
        '<label for="cb_' + i + '">' + escapeHtml(name) + '</label>' +
      '</div>' +
      '<div class="lender-notes" id="notes_' + i + '">' +
        '<span class="lender-notes-label">What does the broker need from ' + escapeHtml(name) + '?</span>' +
        '<textarea id="ta_' + i + '" placeholder="Enter broker notes for ' + escapeHtml(name) + '..."></textarea>' +
      '</div>' +
    '</div>';
  });
  container.innerHTML = html;
}

function escapeHtml(str) {
  var div = document.createElement("div");
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function toggleCheckbox(index, fromCheckbox) {
  var cb = document.getElementById("cb_" + index);
  if (!cb) return;

  var checked = document.querySelectorAll("#lender-list input[type=checkbox]:checked");

  // If clicking the row (not the checkbox directly), toggle the checkbox
  if (!fromCheckbox) {
    if (!cb.checked && checked.length >= MAX_LENDERS) {
      document.getElementById("error").textContent = "Maximum " + MAX_LENDERS + " lenders allowed.";
      return;
    }
    cb.checked = !cb.checked;
  } else {
    // Checkbox was clicked directly - check if we need to prevent it
    if (cb.checked && checked.length > MAX_LENDERS) {
      cb.checked = false;
      document.getElementById("error").textContent = "Maximum " + MAX_LENDERS + " lenders allowed.";
      return;
    }
  }

  // Show/hide notes textarea
  var notesDiv = document.getElementById("notes_" + index);
  if (notesDiv) {
    notesDiv.style.display = cb.checked ? "block" : "none";
  }

  updateCount();
}

function updateCount() {
  var checked = document.querySelectorAll("#lender-list input[type=checkbox]:checked");
  document.getElementById("selected-count").textContent = checked.length + " / " + MAX_LENDERS + " selected";
  var allItems = document.querySelectorAll(".lender-item");
  allItems.forEach(function(item, i) {
    var cb = document.getElementById("cb_" + i);
    if (!cb) return;
    if (checked.length >= MAX_LENDERS && !cb.checked) {
      item.classList.add("disabled");
    } else {
      item.classList.remove("disabled");
    }
  });
  if (checked.length <= MAX_LENDERS) {
    document.getElementById("error").textContent = "";
  }
}

function submitApplication() {
  var entries = [];
  document.querySelectorAll("#lender-list input[type=checkbox]:checked").forEach(function(cb) {
    var index = cb.id.replace("cb_", "");
    var name = cb.getAttribute("data-name");
    var ta = document.getElementById("ta_" + index);
    var notes = ta ? ta.value.trim() : "";
    entries.push({ name: name, notes: notes });
  });

  if (entries.length === 0) {
    document.getElementById("error").textContent = "Please select at least one lender.";
    return;
  }

  // Build description with per-lender notes
  var description = "";
  entries.forEach(function(entry, i) {
    if (i > 0) description += "\n";
    description += entry.name + "\n";
    description += entry.notes || "(no notes)";
    description += "\n";
  });

  var btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.textContent = "Submitting...";
  document.getElementById("error").textContent = "";

  var tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  var dueDate = tomorrow.toISOString().split("T")[0];

  ZOHO.CRM.API.insertRecord({
    Entity: "Tasks",
    APIData: [{
      Subject: "Send application to lenders for " + dealName,
      Description: description,
      Status: "New",
      Priority: "High",
      Due_Date: dueDate,
      What_Id: dealId,
      "$se_module": "Deals"
    }],
    Trigger: ["workflow"]
  })
  .then(function(response) {
    if (response && response.data && response.data[0] && response.data[0].code === "SUCCESS") {
      // Send webhook to Make with deal ID
      fetch("https://hook.eu1.make.com/8ubpwhpr9dolcc6e265mh7hd3pkq8w76", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ deal_id: dealId })
      }).catch(function() {});

      document.getElementById("app").style.display = "none";
      document.getElementById("done").style.display = "block";
      setTimeout(function() {
        try { ZOHO.CRM.UI.Popup.closeReload(); } catch(e) {
          try { ZOHO.CRM.UI.Popup.close(); } catch(e2) {}
        }
      }, 1500);
    } else {
      document.getElementById("error").textContent = "Error: " + JSON.stringify(response);
      btn.disabled = false;
      btn.textContent = "Submit";
    }
  })
  .catch(function(err) {
    document.getElementById("error").textContent = "Error: " + JSON.stringify(err);
    btn.disabled = false;
    btn.textContent = "Submit";
  });
}
</script>

</body>
</html>
